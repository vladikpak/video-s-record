databaseChangeLog:
 - changeSet:
    id: 002-create-videos-table
    author: student
    changes:
      - createTable:
          tableName: videos
          columns:
            - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true } }
            - column: { name: title, type: VARCHAR(200), constraints: { nullable: false } }
            - column: { name: artist, type: VARCHAR(200), constraints: { nullable: false } }
            - column: { name: video_url, type: VARCHAR(500), constraints: { nullable: false } }
            - column: { name: thumbnail_url, type: VARCHAR(500) }
            - column: { name: created_at, type: TIMESTAMP, defaultValueComputed: CURRENT_TIMESTAMP }